# FineGrasp is EconomicGrasp with three changes. Each cell trains EconomicGrasp with one of
# them, and `all` with the three together: the FineGrasp model under EconomicGrasp's recipe
# (one process, batches of four, Adam at 1e-3). Data, evaluator and seed are the same; each
# run trains for the ten epochs of the recipe and is scored on the whole test split.
#
#   grasppanda prepare graspnet1b --graspness --camera realsense \
#       --config finegrasp/finegrasp_sunet14_g1b-realsense_10e      # the instance-normalised asset
#   grasppanda sweep projects/finegrasp_ablation/changes.yaml --dry-run
#   grasppanda sweep projects/finegrasp_ablation/changes.yaml --gpus 0,1,2,3 \
#       --opts evaluation.num_workers=8
#
# The cell without a change is the model zoo's EconomicGrasp row: the same config and seed.
base: economicgrasp/economicgrasp_sunet14_g1b-realsense_10e
seeds: [0]
axes:
  change:
    # Graspness is normalised within every object before the frame.
    graspness: &graspness
      - "data.train.dataset.graspness.normalization=instance"
    # The encoder reads [x, y, z | surface normal] per point instead of three ones.
    normals: &normals
      - "model.point_features=observation"
      - "model.backbone.in_channels=6"
      - "data.train.dataset.images=[depth]"
      - "data.val.dataset.images=[depth]"
      - "data.test.dataset.images=[depth]"
      - "data.train.dataset.transforms=[{type: DepthNormals, step: 1, towards_camera: true, encoding: image8}, {type: RandomSample, num_points: 20000}, {type: RandomFlip, axis: x, prob: 0.5}, {type: CoordinateFeatures}]"
      - "data.val.dataset.transforms=[{type: DepthNormals, step: 1, towards_camera: true, encoding: image8}, {type: RandomSample, num_points: 20000}, {type: CoordinateFeatures}]"
      - "data.test.dataset.transforms=[{type: DepthNormals, step: 1, towards_camera: true, encoding: image8}, {type: RandomSample, num_points: 20000}, {type: CoordinateFeatures}]"
    # Every seed is cropped at four radii; attention over the scales fuses the four.
    multi-scale: &multi_scale
      - "model.grouper={type: MultiScaleGroup, radius: 0.07, radius_scales: [0.25, 0.5, 0.75, 1.0], fusion_layers: 2, fusion_heads: 8, fusion_feedforward_channels: 1024, fusion_dropout: 0.1, branch: {type: CylinderInteractionGroup, hmin: -0.02, hmax: 0.04, nsample: 16, mlp_channels: [256, 256], centre_coordinates: true, attention_heads: 1, attention_dropout: 0.05, post_mlp_channels: [256, 256]}}"
    all: [*graspness, *normals, *multi_scale]
