name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m compileall -q grasppanda
      - run: python -m grasppanda --help
      - run: python -m grasppanda list
      - run: python -m grasppanda init --method graspness
