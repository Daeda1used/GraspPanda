name: Source integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m compileall -q grasppanda
      - name: Check public distribution contents
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          roots = {'.github', '.gitattributes', '.gitignore', 'GraspNet-1B', 'LICENSE', 'README.md',
                   'docs', 'grasppanda', 'panda', 'pyproject.toml', 'uv.lock'}
          private = {'tests', 'reports', 'logs', 'outputs', 'checkpoints', 'upstream',
                     'environments', '.venv', '__pycache__', '.pytest_cache', '.python-version'}
          extensions = {'.md', '.py', '.cpp', '.cu', '.sh', '.yaml', '.yml', '.json', '.toml', '.lock', '.patch'}
          for name in files:
              path = Path(name)
              assert path.parts[0] in roots, f'Unexpected distribution root: {name}'
              assert not private.intersection(path.parts), f'Local artifact: {name}'
              assert not path.is_symlink(), f'Local symlink: {name}'
              assert path.suffix in extensions or name in {'panda', 'LICENSE', '.gitignore', '.gitattributes'}, name
              text = path.read_text()
              assert not re.search(r'[\u3400-\u9fff]', text), f'Use English in public files: {name}'
              assert not re.search(r'/(?:home|root|Users)/', text), f'Personal filesystem path: {name}'
              assert path.stat().st_size < 1_000_000, f'Unexpected large artifact: {name}'
          for name in files:
              if not name.endswith('.md'):
                  continue
              for target in re.findall(r'\]\(([^)]+)\)', Path(name).read_text()):
                  if '://' not in target and not target.startswith('#'):
                      assert (Path(name).parent / target.split('#')[0]).exists(), (name, target)
          import io
          import tarfile
          archive = subprocess.check_output(['git', 'archive', '--format=tar', 'HEAD'])
          with tarfile.open(fileobj=io.BytesIO(archive)) as package:
              names = package.getnames()
              assert not any(name.startswith('.github') for name in names)
              assert {'panda', 'README.md', 'pyproject.toml', 'uv.lock'} <= set(names)
          PY
      - name: Validate registered operations and source pins
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path
          from grasppanda import __version__
          from grasppanda.config import catalogue, capabilities, Experiment
          from grasppanda.sweeps import Sweep
          from grasppanda.templates import examples, configuration
          assert __version__ == tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          methods = catalogue()
          pins = json.loads(Path('grasppanda/resources/upstreams.lock.json').read_text())
          assert set(methods) == {p['id'] for p in pins}
          sources = {p['path']: p.get('pinned_commit', p.get('commit')) for p in pins}
          for p in json.loads(Path('grasppanda/resources/component_sources.lock.json').read_text()):
              assert len(p['commit']) == 40
              if p['path'] in sources:
                  assert sources[p['path']] == p['commit']
          weights = json.loads(Path('grasppanda/resources/component_weights.json').read_text())
          assert len({p['id'] for p in weights}) == len(weights)
          assert len({p['path'] for p in weights}) == len(weights)
          for p in weights:
              assert re.fullmatch(r'[0-9a-f]{64}', p['sha256'])
              assert re.fullmatch(r'https://huggingface.co/timm/[^/]+/resolve/[0-9a-f]{40}/model.safetensors', p['source'])
              assert p['path'] == 'checkpoints/components/' + p['id'] + '.safetensors'
              assert p['bytes'] > 0 and p['license'] and p['license_url'].startswith('https://')
              assert len(p['mean']) == len(p['std']) == 3 and all(v > 0 for v in p['std'])
          for mid in methods:
              for action in capabilities(mid):
                  assert action in ('infer', 'evaluate', 'train_check', 'train_smoke', 'train', 'pipeline_smoke')
          Experiment(method='graspnet_baseline').validate()
          sample = Sweep.from_dict({'base': {'method': 'graspnet_baseline', 'action': 'infer'}, 'grid': {'seed': [0, 1]}})
          assert [config.seed for config in sample.expand()] == [0, 1]
          for name, entry in examples().items():
              assert entry['description'] and set(entry) == {'description', 'config'}
              configuration(example=name)
          for mid in methods:
              if capabilities(mid):
                  configuration(method=mid)
          PY
