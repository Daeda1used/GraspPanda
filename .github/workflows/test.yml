name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: py${{ matrix.python }} · numpy ${{ matrix.numpy }} · torch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported stack
          - {python: "3.10", numpy: "1.26.*", torch: "2.1.*"}
          # current stack
          - {python: "3.12", numpy: "2.*", torch: "2.*"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs derives the version from git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy==${{ matrix.numpy }}"
          pip install -e ".[dev,spconv-cpu]"   # the CPU wheel, so sparse components are tested too
      - name: Test
        # Tiny test tensors gain nothing from threads. The CPU-only spconv wheel needs no
        # setting (its convolutions run on one thread by themselves, see
        # grasppanda/ops/sparse/_spconv.py); a unit test runs them with three.
        env:
          OMP_NUM_THREADS: "1"
        run: pytest --cov=grasppanda --cov-report=term-missing

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel outside the checkout and run from an empty directory
        env:
          OMP_NUM_THREADS: "1"
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          wheel="$(ls dist/*.whl)"
          pip install "${wheel}[spconv-cpu]"
          mkdir -p "$RUNNER_TEMP/smoke/projects"
          cp -r projects/example_project "$RUNNER_TEMP/smoke/projects/"
          cd "$RUNNER_TEMP/smoke"
          grasppanda --version
          grasppanda print-config _base_/default_runtime.yaml --check
          # a shipped method config loads and passes the check (other methods below)
          grasppanda print-config scale_balanced_grasp/sbg_pointnet2-transformer_g1b-realsense_18e --check
          # a config of one's own inherits a shipped one by name, from any directory
          printf '_base_: [hggd/hggd_r34w8_g1b-realsense_15e.yaml]\ntrain: {epochs: 2}\n' > child.yaml
          grasppanda print-config child.yaml --check
          # the example project copied out of the checkout: the README's training command
          grasppanda train projects/example_project/configs/toy_train.yaml
          # a composed sparse encoder, wired on the CPU with the CPU-only spconv wheel
          grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --set backbone=ptv3 -o x.yaml
          grasppanda probe x.yaml --synthetic --device cpu
          # the measured records ship in the wheel: the options of a method's slot
          grasppanda compose hggd/hggd_r34w8_g1b-realsense_15e --list image_encoder --json > /dev/null
