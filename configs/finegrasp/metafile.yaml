# Machine-readable source of the FineGrasp zoo entry; validated by grasppanda.hub.load_metafile.
#
# Reported numbers, the authors' weights scored by this toolbox on the whole test split
# (`author-ckpt`) and the model trained here from scratch (`reproduced`), each measured
# row with its result record. The 120-frame sample of README.md is not a split AP and is
# not listed.
method: FineGrasp
title: "FineGrasp: Towards Robust Grasping for Delicate Objects"
venue: arXiv 2025
paper: https://arxiv.org/abs/2507.05978
upstream:
  repository: HorizonRobotics/robo_orchard_lab
  commit: 221ec0e1030b1fa0a57a3d92c22e8603f4419c93
  release: "robo_orchard_lab 0.4.0 (PyPI): the package the parity fixtures were recorded with; its FineGrasp model, loss, label-matching, dataset and metric files are those of the commit"
  license: "Apache-2.0 (LICENSE file); the FineGrasp sources derive from EconomicGrasp and, through it, from graspnet-baseline, which is under a non-commercial research licence"
implementation: clean-room

models:
  - name: finegrasp_sunet14_g1b-realsense_10e
    config: finegrasp/finegrasp_sunet14_g1b-realsense_10e.yaml
    protocol: graspnet1b-sv-v1
    camera: realsense
    weights:
      # Trained here from scratch: the config at commit 400b733 with the README's command
      # for four 24 GB GPUs (4 processes, 4 frames each, the gradients of 2 batches per
      # step: 32 frames a step as in the published recipe), 10 epochs, seed 0, about 5.1
      # hours on four RTX 3090; the file is the checkpoint of epoch 10 (230,240,145
      # bytes). One training run with one seed.
      url: null
      sha256: e8b99d4390d908abb4cfc5ed51958bd1608124add3c1d26d7f54d5f5f7e2dea8
      license: null
      source: grasppanda
      note: "Not published yet: trained on GraspNet-1Billion (CC BY-NC-SA 4.0); whether and where these weights are published has not been decided."
    author_weights:
      # finegrasp_pipeline/model.safetensors of the authors' model repository, converted
      # with `convert` (the command of README.md).
      # The digest is the one the model hub lists for the file and the one of the copy
      # the parity tests ran on.
      url: https://huggingface.co/HorizonRobotics/FineGrasp/blob/main/finegrasp_pipeline/model.safetensors
      sha256: 30c1f335567dcd726c11fb60249da65e26cc92c2f82928a4e4123ac235b38f79
      license: "apache-2.0 on the model card; trained on GraspNet-1Billion, whose data and labels are CC BY-NC-SA 4.0"
      source: author
      convert: "python -m tools.convert_checkpoint finegrasp_pipeline/model.safetensors finegrasp_realsense.pth --source-format finegrasp --camera realsense"
    results:
      - provenance: reported
        collision_filter: false
        source: "paper (arXiv 2507.05978), Table I, 'FineGrasp'; the same row is in the README of the upstream project and on the model card, which names this weight file"
        AP: {seen: 71.67, similar: 62.83, novel: 27.40}
      - provenance: reported
        collision_filter: true
        source: "paper (arXiv 2507.05978), Table I, 'FineGrasp + CD'; the same row is in the README of the upstream project and on the model card, which names this weight file"
        AP: {seen: 73.71, similar: 64.56, novel: 28.14}
      # GraspNet-1Billion, the whole test split (90 scenes, 23,040 frames)
      # through `grasppanda test` at commit 4bc5333, scored by GraspNet1BEvaluator.
      # Every split is within 0.11 AP of the reported value, with and without the filter.
      - provenance: author-ckpt
        collision_filter: false
        evaluator: GraspNet1BEvaluator
        record: records/finegrasp_sunet14_g1b-realsense_10e_author-ckpt_test_raw.json
        inputs: "workspace crop from the ground-truth segmentation, as in the reference (gt_assisted: workspace)"
        AP: {seen: 71.56, similar: 62.80, novel: 27.42}
      - provenance: author-ckpt
        collision_filter: true
        evaluator: GraspNet1BEvaluator
        record: records/finegrasp_sunet14_g1b-realsense_10e_author-ckpt_test_cd.json
        inputs: "workspace crop from the ground-truth segmentation, as in the reference (gt_assisted: workspace)"
        AP: {seen: 73.69, similar: 64.62, novel: 28.18}
      # GraspNet-1Billion, the whole test split (90 scenes, 23,040 frames)
      # through `grasppanda test` at commit 400b733, scored by GraspNet1BEvaluator.
      # Below the paper by 1.90 / 3.11 / 1.63 AP (off) and 1.28 / 2.69 / 1.20 (on); see
      # README.md, "Results", for what is known about the gap.
      - provenance: reproduced
        collision_filter: false
        evaluator: GraspNet1BEvaluator
        record: records/finegrasp_sunet14_g1b-realsense_10e_reproduced_test_raw.json
        inputs: "workspace crop from the ground-truth segmentation, as in the reference (gt_assisted: workspace)"
        AP: {seen: 69.77, similar: 59.72, novel: 25.77}
      - provenance: reproduced
        collision_filter: true
        evaluator: GraspNet1BEvaluator
        record: records/finegrasp_sunet14_g1b-realsense_10e_reproduced_test_cd.json
        inputs: "workspace crop from the ground-truth segmentation, as in the reference (gt_assisted: workspace)"
        AP: {seen: 72.43, similar: 61.87, novel: 26.94}
