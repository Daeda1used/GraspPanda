# GraspNet-baseline (CVPR 2020) with the PointNet++ backbone of the reference
# implementation, GraspNet-1Billion, RealSense, the reference recipe (18 epochs).
#
#   grasppanda prepare graspnet1b --labels
#   grasppanda prepare graspnet1b --tolerance --config graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e
#   grasppanda train graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e
#   grasppanda test  graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --weights <checkpoint>
#
# Results are always reported for both post-processing variants below. The numbers of
# the reference repository are the `cd` variant: its test script filters collisions by
# default (threshold 0.01 m, voxel 0.01 m).
#
# Every slot of this config and the command that lists the options that fit it, with
# what was measured for each (also docs/methods/graspnet_baseline.md):
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list backbone   # model.backbone
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list proposal   # model.proposal
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list view       # model.view
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list assigner   # model.assigner
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list grouper    # model.grouper
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list head       # model.head
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list loss       # model.<stage>.<term>_loss
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list post       # evaluation.variants.post
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list optimizer  # optimizer
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list schedule   # scheduler
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list hooks      # hooks
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list augment    # data.train.dataset.transforms
#   grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list recipe     # optimizer, scheduler, hooks, transforms
_base_:
  - ../_base_/models/graspnet_baseline.yaml
  - ../_base_/datasets/graspnet1b_realsense_tolerance.yaml
  - ../_base_/schedules/graspnet_baseline_18e.yaml
  - ../_base_/default_runtime.yaml

data:
  val:
    dataset:
      keep_full_points: true      # the collision filter reads the cloud before sub-sampling
  test:
    dataset:
      keep_full_points: true

# Slot post (a variant `post` beside these): grasppanda compose graspnet_baseline/graspnet-baseline_pointnet2_g1b-realsense_18e --list post
evaluation:
  evaluator: {type: GraspNet1BEvaluator}
  variants:
    raw: []                       # predictions as the model emits them
    cd:                           # the reference's model-free collision filter, on by default there
      - {type: ModelFreeCollisionFilter}
