# EXPERIMENTAL. No AP is claimed. Composed by `grasppanda compose`: this config passes
# the config check; it has not been trained to convergence or evaluated.
#
#   base  gsnet/gsnet_sunet14_g1b-realsense_10e (GSNet)
#   set   backbone `spunet`
#
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --set backbone=spunet
#   grasppanda probe experimental/gsnet_spunet_g1b-realsense_10e
#   grasppanda train experimental/gsnet_spunet_g1b-realsense_10e
#
# Everything not set below is the base config's: the other stages, the data and the
# schedule. `probe` trains a few iterations on real frames and predicts, in about a minute.
# What a swap changes besides these lines is in docs/advanced_guides/swapping.md.
#
# What compose did, and why:
# * backbone: preset `spunet` (SpUNet). SpUNet, the deep sparse U-Net of Pointcept
#   (MinkUNet-34C block counts), on a 5 mm grid.
#
# What must be re-tuned, and why (from grasppanda/presets/<slot>/<preset>.yaml):
# backbone `spunet`
# * grid_size: 0.005 m, GSNet's. The class default, 0.02 m, is for ScanNet rooms. The
#   coarsest voxel is 16 x the grid, 8 cm here; what grows against SparseUNet14 is the
#   number of 3 x 3 x 3 convolutions per level, and with it how far a feature reaches.
# * out_channels: 512, the width of SparseUNet14's output. The published model ends on
#   20 class scores; `null` returns the 96 channels of the last decoder stage. Compose
#   sets it to the width of the encoder it replaces.
# * in_channels: 3 constant ones (the published model reads colour and normal).
# * learning rate. The recipes of the reference methods (Adam 1e-3 without warm-up) were
#   tuned for a network a third of this depth: in the 10-iteration training check under
#   GSNet most seeds were lost in two iterations (configs/experimental/README.md).
# * batch size and memory: more per frame than the reference encoder.
# the base config
# * the recipe: optimizer, schedule, batch size and point budget are the base config's,
#   tuned by its authors for its own stages. A starting point, not a claim.
_base_:
  - ../gsnet/gsnet_sunet14_g1b-realsense_10e.yaml

model:
  backbone:
    type: SpUNet                  # `dense`: one feature per input point
    in_channels: 3                # constant ones; geometry enters through the voxel grid
    out_channels: 512
    grid_size: 0.005
