# EXPERIMENTAL. No AP is claimed. Composed by `grasppanda compose`: this config passes
# the config check; it has not been trained to convergence or evaluated.
#
#   base  hggd/hggd_r34w8_g1b-realsense_15e (HGGD)
#   set   image_encoder `dinov2-small-reg-depth-stem`
#
#   grasppanda compose hggd/hggd_r34w8_g1b-realsense_15e --set \
#       image_encoder=dinov2-small-reg-depth-stem
#   grasppanda probe experimental/hggd_dinov2-small-reg-depth-stem_g1b-realsense_15e
#   grasppanda train experimental/hggd_dinov2-small-reg-depth-stem_g1b-realsense_15e
#
# Everything not set below is the base config's: the other stages, the data and the
# schedule. `probe` trains a few iterations on real frames and predicts, in about a minute.
# What a swap changes besides these lines is in docs/advanced_guides/swapping.md.
#
# What compose did, and why:
# * image_encoder: preset `dinov2-small-reg-depth-stem` (TimmImageEncoder). Frozen DINOv2
#   ViT-S/14 with registers (timm) and a trained depth stem in front.
#
# What must be re-tuned, and why (from grasppanda/presets/<slot>/<preset>.yaml):
# image_encoder `dinov2-small-reg-depth-stem`
# * depth: depth_stem. The stem's last layer starts at zero, so the frozen model first sees the
#   colour image unchanged; what it learns is a colour-space encoding of depth that the frozen
#   features can use. An idea to try, not a published recipe.
# * input_size: the image (360 x 640) is resampled to 364 x 644, a size this model can take, and
#   the model is built for it (`model_args.img_size`). For another `model.image.size` change both.
# * single-scale maps: a plain ViT returns every map at its patch stride, so the pyramid decoder
#   merges layers, not resolutions. The heat-map is decoded from stride 14; fine structure has to
#   be learned by the decoder.
# * model.encoder.decoder_channels (default 64): width of the pyramid decoder that follows this
#   encoder and of the feature map of the region stage.
# * optimizer: HGGD's recipe trains a 1.6 M-parameter network from scratch. A pretrained encoder
#   usually wants a smaller learning rate than the decoder, or `frozen: true`.
# * no AP is claimed: this combination was probed for 20 iterations, never trained.
# the base config
# * the recipe: optimizer, schedule, batch size and point budget are the base config's,
#   tuned by its authors for its own stages. A starting point, not a claim.
_base_:
  - ../hggd/hggd_r34w8_g1b-realsense_15e.yaml

model:
  image_encoder:
    type: TimmImageEncoder
    name: vit_small_patch14_reg4_dinov2.lvd142m
    pretrained: true              # timm downloads the weights; or `checkpoint: <file>`
    model_args:
      img_size: [364, 644]
    input_size: [364, 644]
    depth: depth_stem             # rgb_only | fourth_channel | depth_stem
    frozen: true
