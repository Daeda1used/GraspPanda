# HGGD: machine-readable source of the model-zoo rows of this method.
#
# Reported numbers, the authors' two checkpoints scored by this toolbox on whole test
# splits (`author-ckpt`) and the RealSense model trained here from scratch (`reproduced`),
# each measured row with its result record.
method: HGGD
title: "Efficient Heatmap-Guided 6-DoF Grasp Detection in Cluttered Scenes"
venue: RA-L 2023
paper: https://arxiv.org/abs/2403.18546
upstream: {repository: THU-VCLab/HGGD, commit: 69580ff, license: MIT}
implementation: clean-room
models:
  - name: hggd_r34w8_g1b-realsense_15e
    config: hggd/hggd_r34w8_g1b-realsense_15e.yaml
    protocol: graspnet1b-sv-v1
    camera: realsense
    weights: &realsense_weights
      # Trained here from scratch: `grasppanda train hggd/hggd_r34w8_g1b-realsense_15e`
      # at commit 400b733, the recipe of that config unchanged (15 epochs, batches of 4 with
      # two batches per optimizer step, AdamW at 1e-2 divided by ten every 5 epochs, seed 0,
      # float32, one RTX 3090 shared with other jobs, 23.6 hours), on the 25,600 RealSense
      # frames of the training scenes with the per-view labels of that config (suppressed
      # at 2 cm and 60 degrees, as the released converter writes them); the file is the
      # checkpoint of epoch 15 (41,479,165 bytes). One training run with one seed.
      url: null
      sha256: 0d774db966c362cf8dc012798e2037f1e5d53bf50a315da624e2b0e1e2c6bad1
      license: null
      source: grasppanda
      note: "Not published yet: trained on GraspNet-1Billion (CC BY-NC-SA 4.0); whether and where these weights are published has not been decided."
    author_weights: &realsense_author_weights
      # The file HGGD_realsense_checkpoint of the folder below, the link of the upstream
      # README, converted with `convert` (the command of README.md).
      # The digest is that of the file that was converted for the records below and of a
      # download from the folder on 2026-10-13.
      url: https://cloud.tsinghua.edu.cn/d/e3edfc2c8b114513b7eb/
      sha256: b95da06d8723298ad28e4c720c3a6a8af73dfe6f2e8126f43de8845bf62ad6df
      license: "MIT (the upstream repository); trained on GraspNet-1Billion (CC BY-NC-SA 4.0)"
      source: author
      convert: "python -m tools.convert_checkpoint HGGD_realsense_checkpoint hggd_realsense.pth --source-format hggd --camera realsense"
    results:
      # Neither source says whether the collision filter of the released test script
      # (which dumps filtered grasps) was applied.
      - provenance: reported
        collision_filter: null
        AP: {seen: 59.36, similar: 51.20, novel: 22.17}
        source: "paper; row 'In paper' of the repository README"
      - provenance: reported
        collision_filter: null
        AP: {seen: 64.45, similar: 53.59, novel: 24.59}
        source: "repository README, row 'In repo' (also the arXiv version)"
      # GraspNet-1Billion, the whole test split (90 scenes, 23,040 frames)
      # through `grasppanda test` at commit 400b733 (float32, an RTX 3090), scored by
      # GraspNet1BEvaluator. The network draws random numbers at inference; these rows are
      # one run with seed 0.
      - provenance: author-ckpt
        collision_filter: false
        evaluator: GraspNet1BEvaluator
        record: records/hggd_r34w8_g1b-realsense_15e_author-ckpt_test_raw.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {seen: 58.36, similar: 47.95, novel: 22.08}
      # Post-processing of 'cd': ModelFreeCollisionFilter, then GraspNMS, as the released
      # test script dumps its grasps.
      - provenance: author-ckpt
        collision_filter: true
        evaluator: GraspNet1BEvaluator
        record: records/hggd_r34w8_g1b-realsense_15e_author-ckpt_test_cd.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {seen: 63.72, similar: 52.91, novel: 24.16}
      # The model trained here (`weights` above): the whole test split (90 scenes, 23,040
      # frames) through `grasppanda test` at commit 400b733, scored by GraspNet1BEvaluator.
      # It is far below the authors' checkpoint: −10.35 / −6.53 / −3.20 AP (off) and
      # −8.42 / −4.31 / −2.46 (on). README.md, "Results", says what was found: the
      # labels the released converter writes are sparser than those the checkpoint fits.
      - provenance: reproduced
        collision_filter: false
        evaluator: GraspNet1BEvaluator
        record: records/hggd_r34w8_g1b-realsense_15e_reproduced_test_raw.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {seen: 48.01, similar: 41.42, novel: 18.88}
      # Post-processing of 'cd': ModelFreeCollisionFilter, then GraspNMS.
      - provenance: reproduced
        collision_filter: true
        evaluator: GraspNet1BEvaluator
        record: records/hggd_r34w8_g1b-realsense_15e_reproduced_test_cd.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {seen: 55.30, similar: 48.60, novel: 21.70}
  # Cross-dataset transfer: the RealSense weights above, scored on GraspClutter6D. No
  # number is published for HGGD on that dataset.
  - name: hggd_r34w8_g1b-realsense-to-gc6d-d435_15e
    config: hggd/hggd_r34w8_g1b-realsense-to-gc6d-d435_15e.yaml
    protocol: graspclutter6d-sv-v1
    camera: realsense-d435
    weights: *realsense_weights
    author_weights: *realsense_author_weights
    results:
      # GraspClutter6D, the whole test split (235 scenes, 3,055 frames)
      # through `grasppanda test` at commit 400b733 (float32, an RTX 3090), scored by
      # GraspClutter6DEvaluator.
      - provenance: author-ckpt
        collision_filter: false
        evaluator: GraspClutter6DEvaluator
        record: records/hggd_r34w8_g1b-realsense-to-gc6d-d435_15e_author-ckpt_test_raw.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {test: 14.24}
        AP0.8: {test: 17.40}
        AP0.4: {test: 9.24}
      # Post-processing of 'cd': ModelFreeCollisionFilter, then GraspNMS.
      - provenance: author-ckpt
        collision_filter: true
        evaluator: GraspClutter6DEvaluator
        record: records/hggd_r34w8_g1b-realsense-to-gc6d-d435_15e_author-ckpt_test_cd.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {test: 14.56}
        AP0.8: {test: 17.75}
        AP0.4: {test: 9.38}
      # The model trained here: the whole test split (235 scenes, 3,055 frames) through
      # `grasppanda test` at commit 400b733, scored by GraspClutter6DEvaluator. From the
      # authors' checkpoint: −1.29 / −1.40 / −1.08 (off) and −0.07 / +0.13 / −0.43 (on).
      - provenance: reproduced
        collision_filter: false
        evaluator: GraspClutter6DEvaluator
        record: records/hggd_r34w8_g1b-realsense-to-gc6d-d435_15e_reproduced_test_raw.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {test: 12.95}
        AP0.8: {test: 16.00}
        AP0.4: {test: 8.16}
      # Post-processing of 'cd': ModelFreeCollisionFilter, then GraspNMS.
      - provenance: reproduced
        collision_filter: true
        evaluator: GraspClutter6DEvaluator
        record: records/hggd_r34w8_g1b-realsense-to-gc6d-d435_15e_reproduced_test_cd.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {test: 14.49}
        AP0.8: {test: 17.88}
        AP0.4: {test: 8.95}
  - name: hggd_r34w8_g1b-kinect_15e
    config: hggd/hggd_r34w8_g1b-kinect_15e.yaml
    protocol: graspnet1b-sv-v1
    camera: kinect
    weights:
      # The file HGGD_kinect_checkpoint of the same folder, converted with `convert` (the
      # command of README.md).
      # The digest is that of the file that was converted for the records below and of a
      # download from the folder on 2026-10-13.
      url: https://cloud.tsinghua.edu.cn/d/e3edfc2c8b114513b7eb/
      sha256: 721d0cccad7cf80a9910bfba95d9aaf164a5117f731cd1a0ba5e21a04e4cad49
      license: "MIT (the upstream repository); trained on GraspNet-1Billion (CC BY-NC-SA 4.0)"
      source: author
      convert: "python -m tools.convert_checkpoint HGGD_kinect_checkpoint hggd_kinect.pth --source-format hggd --camera kinect"
    results:
      - provenance: reported
        collision_filter: null
        AP: {seen: 60.26, similar: 48.59, novel: 18.43}
        source: "paper; row 'In paper' of the repository README"
      - provenance: reported
        collision_filter: null
        AP: {seen: 61.17, similar: 47.02, novel: 19.37}
        source: "repository README, row 'In repo'"
      # GraspNet-1Billion, the whole test split (90 scenes, 23,040 frames)
      # through `grasppanda test` at commit 400b733 in float32 on an RTX 3090, scored by
      # GraspNet1BEvaluator. One run with seed 0, as for the RealSense rows.
      - provenance: author-ckpt
        collision_filter: false
        evaluator: GraspNet1BEvaluator
        record: records/hggd_r34w8_g1b-kinect_15e_author-ckpt_test_raw.json
