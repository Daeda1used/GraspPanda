        AP: {seen: 56.98, similar: 43.97, novel: 18.56}
      # Post-processing of 'cd': ModelFreeCollisionFilter, then GraspNMS.
      - provenance: author-ckpt
        collision_filter: true
        evaluator: GraspNet1BEvaluator
        record: records/hggd_r34w8_g1b-kinect_15e_author-ckpt_test_cd.json
        inputs: "nothing derived from ground truth: HGGD crops no workspace (gt_assisted: none)"
        AP: {seen: 60.30, similar: 46.85, novel: 19.22}
