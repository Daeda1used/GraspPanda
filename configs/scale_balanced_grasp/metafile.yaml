# Machine-readable description of Scale-Balanced-Grasp; validated by grasppanda.hub.load_metafile.
#
# Only numbers with a stated provenance appear here: reported numbers, and the authors'
# checkpoint scored by this toolbox on whole test splits (`author-ckpt`, each row with its
# result record). No model has been trained here, so there is no `reproduced` result. The
# 20-frame subset measurement reported in README.md is not a split AP and is not listed.
method: Scale-Balanced-Grasp
title: "Towards Scale Balanced 6-DoF Grasp Detection in Cluttered Scenes"
venue: CoRL 2022
paper: https://openreview.net/pdf?id=tiPHpS4eA4
upstream:
  repository: mahaoxiang822/Scale-Balanced-Grasp
  commit: 995d6f892474c91fbfcdf58f7d79589be4cbb41c
  license: MIT (LICENSE file); the code derives from graspnet-baseline, which is under a non-commercial research licence
implementation: clean-room

models:
  - name: sbg_pointnet2-transformer_g1b-realsense_18e
    config: scale_balanced_grasp/sbg_pointnet2-transformer_g1b-realsense_18e.yaml
    protocol: graspnet1b-sv-v1
    camera: realsense
    weights: &realsense_weights
      # The authors' checkpoint-rs.tar from the folder below, to be converted with
      #   python -m tools.convert_checkpoint ... --source-format scale-balanced-grasp
      # The digest is that of the copy the parity tests ran on (dated 2023-01-05); it has
      # not been compared with a fresh download.
      url: https://drive.google.com/drive/folders/1Y2o0uAbhS6-yZhPkKMAAnL0tCpbiJfk0?usp=share_link
      sha256: ebf63c146a7dfd8ced4543b9b9e5b9506cff320bb4b8157cab0c78b3e6ce5aef
      license: as the upstream repository (MIT file; derived from non-commercial code)
      source: author
    results:
      # Quoted from Table 2 of the paper (arXiv 2212.05275); whether these rows use
      # object-balanced sampling is not stated.
      - provenance: reported
        collision_filter: false
        source: paper (arXiv 2212.05275), Table 2, "Ours"
        AP: {seen: 58.95, similar: 52.97, novel: 22.63}
      - provenance: reported
        collision_filter: true
        source: paper (arXiv 2212.05275), Table 2, "Ours + CD"
        AP: {seen: 63.83, similar: 58.46, novel: 24.63}
      # GraspNet-1Billion, the whole test split (90 scenes, 23,040 frames)
      # through `grasppanda test` at commit 4bc5333, scored by GraspNet1BEvaluator.
      # Both variants are 0.5 to 1.7 AP below the reported rows; see README.md, "Results".
      - provenance: author-ckpt
        collision_filter: false
        evaluator: GraspNet1BEvaluator
        record: records/sbg_pointnet2-transformer_g1b-realsense_18e_author-ckpt_test_raw.json
        inputs: "workspace crop from the ground-truth segmentation, as in the reference (gt_assisted: workspace)"
        AP: {seen: 57.78, similar: 51.66, novel: 22.12}
      - provenance: author-ckpt
        collision_filter: true
        evaluator: GraspNet1BEvaluator
        record: records/sbg_pointnet2-transformer_g1b-realsense_18e_author-ckpt_test_cd.json
        inputs: "workspace crop from the ground-truth segmentation, as in the reference (gt_assisted: workspace)"
        AP: {seen: 62.29, similar: 56.80, novel: 24.00}
  # Cross-dataset transfer: the RealSense weights above, scored on GraspClutter6D.
  - name: sbg_pointnet2-transformer_g1b-realsense-to-gc6d-d435_18e
    config: scale_balanced_grasp/sbg_pointnet2-transformer_g1b-realsense-to-gc6d-d435_18e.yaml
    protocol: graspclutter6d-sv-v1
    camera: realsense-d435
    weights: *realsense_weights
    results:
      - provenance: reported
        collision_filter: null    # the publication does not say
        source: "GraspClutter6D paper (arXiv 2504.06866 v3), Table IX, row 'ScaleBalancedGrasp': trained on GraspNet-1Billion, tested on GraspClutter6D with 'workspace-cropped inputs'. The paper does not say which checkpoint was scored."
        AP: {test: 22.69}
        AP0.8: {test: 27.57}
        AP0.4: {test: 16.95}
      # GraspClutter6D, the whole test split (235 scenes, 3,055 frames)
      # through `grasppanda test` at commit 4bc5333, scored by GraspClutter6DEvaluator.
      - provenance: author-ckpt
        collision_filter: false
        evaluator: GraspClutter6DEvaluator
        record: records/sbg_pointnet2-transformer_g1b-realsense-to-gc6d-d435_18e_author-ckpt_test_raw.json
        inputs: "workspace crop: the image rectangle around the ground-truth segmentation, the crop of the official GraspClutter6D tool (gt_assisted: workspace)"
        AP: {test: 21.77}
        AP0.8: {test: 26.49}
        AP0.4: {test: 16.46}
      - provenance: author-ckpt
        collision_filter: true
        evaluator: GraspClutter6DEvaluator
        record: records/sbg_pointnet2-transformer_g1b-realsense-to-gc6d-d435_18e_author-ckpt_test_cd.json
        inputs: "workspace crop: the image rectangle around the ground-truth segmentation, the crop of the official GraspClutter6D tool (gt_assisted: workspace)"
        AP: {test: 22.71}
        AP0.8: {test: 27.61}
        AP0.4: {test: 17.01}
