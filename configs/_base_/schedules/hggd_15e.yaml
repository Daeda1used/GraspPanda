# Training recipe of HGGD (THU-VCLab/HGGD @ 69580ff: train_graspnet.sh, train_graspnet.py,
# train_utils.py). The shell script and the argument defaults of the code disagree in
# the learning rate (1e-2 against 3e-3), the batch size (4 against 8) and the gradient
# accumulation (2 against 1); this follows the script.
#
# One AdamW over both networks, learning rate times 0.1 every 5 epochs, 15 epochs,
# batches of 4 (set in the dataset base) with two batches per optimizer step
# (`train.accumulate: 2`, set in the runnable config: default_runtime.yaml already owns
# that key, and a key may come from one sibling base only).
optimizer:
  type: AdamW
  lr: 1e-2
  weight_decay: 1e-2

scheduler:
  type: StepLR
  step_size: 5
  gamma: 0.1

train:
  epochs: 15
  # The reference SUMS the gradients of the two batches and clips each element at 1; the
  # trainer AVERAGES them, so the same clip is 0.5 here. (AdamW is invariant to the scale
  # of the gradient, so the factor two has no other effect.) Two differences remain and
  # are not reproduced: the reference's first step of an epoch spans three batches, and
  # it drops the gradient of an epoch's last batch.
  grad_clip: 0.5
  grad_clip_mode: value

hooks:
  # The rotation anchors follow the labels during the first `model.anchors.shift_epochs`
  # epochs; the detector has to be told the epoch for that.
  - {type: EpochSignalHook}
  # Batch-norm momentum of the image network only: 0.5 for epochs 1-3, then halved every
  # two epochs, floored at 0.001. `delay: 1` is the reference's schedule, which lags one
  # epoch behind `0.5 * 0.5 ** (epoch // 2)`. The region network keeps PyTorch's 0.1.
  - {type: BNMomentumHook, initial: 0.5, decay: 0.5, step: 2, minimum: 0.001, delay: 1, module: image_net}
