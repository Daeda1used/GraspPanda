# EconomicGrasp (ECCV 2024) with the 14-layer sparse U-Net of the reference
# implementation, GraspNet-1Billion, RealSense, the reference recipe (10 epochs).
#
#   grasppanda prepare graspnet1b --labels
#   grasppanda prepare graspnet1b --graspness --camera realsense
#   grasppanda prepare graspnet1b --compact-labels \
#       --config economicgrasp/economicgrasp_sunet14_g1b-realsense_10e
#   grasppanda train economicgrasp/economicgrasp_sunet14_g1b-realsense_10e
#   grasppanda test  economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --weights <checkpoint>
#
# Results are always reported for both post-processing variants below. The compact
# labels do not depend on the camera: both EconomicGrasp configs read the same asset.
#
# Every slot of this config and the command that lists the options that fit it, with
# what was measured for each (also docs/methods/economicgrasp.md):
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list backbone   # model.backbone
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list proposal   # model.proposal
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list view       # model.view
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list assigner   # model.assigner
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list grouper    # model.grouper
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list head       # model.head
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list loss       # model.<stage>.<term>_loss
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list post       # evaluation.variants.post
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list optimizer  # optimizer
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list schedule   # scheduler
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list hooks      # hooks
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list augment    # data.train.dataset.transforms
#   grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list recipe     # optimizer, scheduler, hooks, transforms
_base_:
  - ../_base_/models/economicgrasp.yaml
  - ../_base_/datasets/graspnet1b_realsense.yaml
  - ../_base_/schedules/economicgrasp_10e.yaml
  - ../_base_/default_runtime.yaml

# The data recipe of the reference implementation (dataset/graspnet_dataset.py,
# dataset/generate_economic.py @ 7361bb6) differs from that of the dataset base in four
# places: compact labels instead of dense grids, 20 000 points instead of 15 000, every
# object and every kept label point is used (no visibility filter, no label
# sub-sampling), and the only augmentation is the flip. Preprocessing, workspace crop
# and point-wise graspness are the same.
data:
  train:
    dataset:
      compact_labels:                 # the asset of `prepare --compact-labels`
        point_friction_threshold: 0.4 # a label point needs one collision-free grasp at least this good
        view_friction_threshold: 0.6  # = model.view.max_friction (checked when the loss is computed)
        max_width: 0.1                # = the gripper opening
      transforms:
        - {type: RandomSample, num_points: 20000}
        - {type: RandomFlip, axis: x, prob: 0.5}
        - {type: ConstantFeatures, channels: 3}
  val:
    dataset:
      transforms:
        - {type: RandomSample, num_points: 20000}
        - {type: ConstantFeatures, channels: 3}
      keep_full_points: true          # the collision filter reads the cloud before sub-sampling
  test:
    dataset:
      transforms:
        - {type: RandomSample, num_points: 20000}
        - {type: ConstantFeatures, channels: 3}
      keep_full_points: true

# Slot post (a variant `post` beside these): grasppanda compose economicgrasp/economicgrasp_sunet14_g1b-realsense_10e --list post
evaluation:
  evaluator: {type: GraspNet1BEvaluator}
  variants:
    raw: []                           # predictions as the model emits them (the published numbers)
    cd:                               # the optional model-free collision filter of the reference test
      - type: ModelFreeCollisionFilter  # script, which reuses the sparse-conv voxel size for it
        voxel_size: 0.005
        approach_distance: 0.05
        collision_threshold: 0.01
