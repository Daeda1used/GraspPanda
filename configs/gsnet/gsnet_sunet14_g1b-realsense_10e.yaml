# GSNet (ICCV 2021) with the 14-layer sparse U-Net of the reference implementation,
# GraspNet-1Billion, RealSense, the reference recipe (10 epochs).
#
#   grasppanda prepare graspnet1b --labels
#   grasppanda prepare graspnet1b --graspness --camera realsense
#   grasppanda train gsnet/gsnet_sunet14_g1b-realsense_10e
#   grasppanda test  gsnet/gsnet_sunet14_g1b-realsense_10e --weights <checkpoint>
#
# The checkpoint released with the reference implementation (graspness_unofficial, a
# third-party implementation; there is no official training code), converted with
#   python -m tools.convert_checkpoint minkuresunet_realsense.tar gsnet_realsense.pth \
#       --source-format graspness-unofficial --camera realsense
# loads into this config unchanged (configs/gsnet/README.md says what it is worth).
#
# Results are always reported for both post-processing variants below.
#
# Every slot of this config and the command that lists the options that fit it, with
# what was measured for each (also docs/methods/gsnet.md):
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list backbone   # model.backbone
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list proposal   # model.proposal
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list view       # model.view
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list assigner   # model.assigner
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list grouper    # model.grouper
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list head       # model.head
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list loss       # model.<stage>.<term>_loss
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list post       # evaluation.variants.post
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list optimizer  # optimizer
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list schedule   # scheduler
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list hooks      # hooks
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list augment    # data.train.dataset.transforms
#   grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list recipe     # optimizer, scheduler, hooks, transforms
_base_:
  - ../_base_/models/gsnet.yaml
  - ../_base_/datasets/graspnet1b_realsense.yaml
  - ../_base_/schedules/gsnet_10e.yaml
  - ../_base_/default_runtime.yaml

data:
  val:
    dataset:
      keep_full_points: true      # the collision filter reads the cloud before sub-sampling
  test:
    dataset:
      keep_full_points: true

# Slot post (a variant `post` beside these): grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e --list post
evaluation:
  evaluator: {type: GraspNet1BEvaluator}
  variants:
    raw: []                       # predictions as the model emits them
    cd:                           # the reference's optional model-free collision filter
      - {type: ModelFreeCollisionFilter}
