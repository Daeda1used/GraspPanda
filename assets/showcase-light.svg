<g font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" xml:space="preserve">
<text class="k7" x="52" y="270"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda compose finegrasp/finegrasp_sunet14_g1b-realsense_10e \</tspan></text>
<text class="k8" x="52" y="305">    <tspan fill="#e6edf3" font-weight="700">--set backbone=point-transformer-v1 --set grouper=cylinder-invres \</tspan></text>
<text class="k9" x="52" y="340">    <tspan fill="#e6edf3" font-weight="700">-o finegrasp_ptv1_invres.yaml</tspan></text>
<text class="k10" x="52" y="383" fill="#e6edf3">  • in_channels: 6. The base config feeds real point features</text>
<text class="k10" x="52" y="418" fill="#e6edf3">    (`point_features: observation`, 6 per point), so the encoder reads</text>
<text class="k10" x="52" y="453" fill="#e6edf3">    those instead of the constant ones of its preset.</text>
<text class="k11" x="52" y="488" fill="#3fb950">  ✓ backbone · proposal</text>
<text class="k12" x="52" y="523" fill="#3fb950">  ✓ grouper · head</text>
<text class="k13" x="52" y="558" fill="#3fb950">  ✓ valid  (hash 3f2867c02913)</text>
<text class="k14" x="52" y="593" fill="#3fb950" font-weight="700">✓ written finegrasp_ptv1_invres.yaml</text>
<text class="k15" x="52" y="270"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda compose finegrasp/finegrasp_sunet14_g1b-realsense_10e \</tspan></text>
<text class="k16" x="52" y="305">    <tspan fill="#e6edf3" font-weight="700">--set view=objectness-view</tspan></text>
<text class="k17" x="52" y="348" fill="#ff7b72">  ✗ view · assigner [structural]: ObjectnessViewStage computes its targets</text>
<text class="k17" x="52" y="383" fill="#ff7b72">    from &#x27;dense&#x27; matched labels, but CompactLabelAssigner returns</text>
<text class="k17" x="52" y="418" fill="#ff7b72">    &#x27;compact&#x27; ones. View stages that read &#x27;compact&#x27; labels:</text>
<text class="k17" x="52" y="453" fill="#ff7b72">    DirectionViewStage, HealpixViewStage, IcosphereViewStage,</text>
<text class="k17" x="52" y="488" fill="#ff7b72">    LatticeViewStage, RomaRotationViewStage, TemplateViewStage,</text>
<text class="k17" x="52" y="523" fill="#ff7b72">    TwoVectorViewStage.</text>
<text class="k18" x="52" y="558" fill="#ff7b72" font-weight="700">✗ refused: nothing was written. The messages above name the conflict and a</text>
<text class="k18" x="52" y="593" fill="#ff7b72" font-weight="700">  fix.</text>
<text class="k19" x="52" y="270"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda probe finegrasp_ptv1_invres.yaml --iters 20 --frames 8</tspan></text>
<text class="k20" x="52" y="313" fill="#e6edf3">  data        8 frames of the config&#x27;s dataset · 8 per iteration</text>
<text class="k21" x="52" y="348" fill="#e6edf3">    loss/view                   2.116 → 1.046         fell 46 %</text>
<text class="k22" x="52" y="383" fill="#e6edf3">    loss/width                  3.225 → 0.9126        fell 68 %</text>
<text class="k23" x="52" y="418" fill="#e6edf3">    loss                        14.34 → 5.694         fell 55 %</text>
<text class="k24" x="52" y="453" fill="#e6edf3">  predicted   2 frame(s) · 1024, 1024 grasps</text>
<text class="k25" x="52" y="488" fill="#e6edf3">  gradient    reached every one of 15 units of 5 part(s)</text>
<text class="k26" x="52" y="523" fill="#3fb950" font-weight="700">✓ runs: trained 20 iterations on 8 frames of the dataset and predicted on</text>
<text class="k26" x="52" y="558" fill="#3fb950" font-weight="700">  2 frame(s), with finite losses and real seeds in every iteration.</text>
