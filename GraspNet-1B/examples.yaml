        blocks: [1, 2, 1, 2, 1, 1, 2, 1]
        dilations: [1, 2, 1, 2, 1, 2, 1, 2]
        stem_channels: 16
        bn_momentum: 0.03
      crop:
        type: native_cylinder
        nsample: 24
        radius: 0.08
        attention_heads: 7
        seed_interaction: gaussian
        interaction_heads: 8
    optimizer:
      type: adamw
      weight_decay: 0.01
    loss:
      functions:
        score: poly1
        width: huber
    augmentation:
