compose-seed-interaction:
  description: Add distance-biased seed attention while retaining EconomicGrasp grouping and decoder
  config:
    method: economicgrasp
    action: train_check
    dataset_root: /data/GraspNet-1B
    checkpoint: checkpoints/economicgrasp/checkpoint-kinect.tar
    camera: kinect
    split: train
    scene: 0
    num_points: 4096
    checkpoint_policy: reuse_unchanged
    learning_rate: 0.0001
    modules:
      crop:
        type: upstream
        seed_interaction: gaussian
        interaction_heads: 4
        interaction_sigma: 0.05
        interaction_layers: 1
        interaction_dropout: 0.1
compose-economicgrasp:
