      backbone:
        type: oacnns
        embed_channels: 64
        stem_depth: 3
        enc_channels: [64, 64, 128, 256]
        enc_depth: [2, 3, 6, 4]
        dec_channels: [96, 96, 128, 256]
        decoder_layers: [2, 3, 2, 2]
        point_grid_size:
        - [16, 32, 64]
        - [8, 16, 24]
        - [4, 8, 12]
        - [2, 4, 6]
        relation_normalization: cluster
