    action: train_check
    dataset_root: /data/GraspNet-1B
    checkpoint: checkpoints/graspnet_baseline/checkpoint-rs.tar
    camera: realsense
    split: train
    scene: 0
    num_points: 4096
    learning_rate: 0.0001
    checkpoint_policy: reuse_unchanged
    modules:
      backbone:
        type: pointvector
        width: 16
        blocks: [1, 2, 2, 2, 2]
        nsample: 16
        local_nsample: 12
        normalize_dp: false
        sa_layers: 2
        sa_use_res: true
        decoder_layers: 3
      crop:
        type: cylinder
        radius_factors: [0.5, 1.0]
        pooling: attention
        nsample: 16
compose-ptv3:
  description: Configure native PTv3 stages, attention windows and optimization
  config:
    method: graspnet_baseline
    action: train_check
    dataset_root: /data/GraspNet-1B
    checkpoint: checkpoints/graspnet_baseline/checkpoint-rs.tar
    camera: realsense
    split: train
    scene: 0
    num_points: 4096
    learning_rate: 0.0001
    checkpoint_policy: reuse_unchanged
    modules:
      backbone:
        type: sonata_ptv3
        enc_depths: [1, 1, 1, 1, 1]
        enc_channels: [32, 64, 128, 256, 512]
        enc_num_head: [2, 4, 8, 16, 32]
        enc_patch_size: [64, 64, 64, 64, 64]
        dec_depths: [1, 1, 1, 1]
        dec_channels: [32, 64, 128, 256]
        dec_num_head: [2, 4, 8, 16]
        dec_patch_size: [32, 32, 32, 32]
        shuffle_orders: false
        drop_path: 0
    optimizer:
      type: adamw
      weight_decay: 0.01
    scheduler:
      type: cosine
      warmup_steps: 1
      min_lr_ratio: 0.1
compose-reslfe:
  description: Configure native ResLFE layers inside oriented cylinders
  config:
