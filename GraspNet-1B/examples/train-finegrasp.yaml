dataset: graspnet1b
method: finegrasp
action: train
dataset_root: /data/GraspNet-1B
checkpoint: checkpoints/finegrasp/finegrasp_pipeline/model.safetensors
camera: realsense
split: train
scene: 0
frame: 0
workspace: official_gt_workspace
num_points: 15000
voxel_size: 0.005
batch_size: 4
epochs: 10
learning_rate: 0.008
data_workers: 2
train_batch_limit: 0
eval_batch_limit: 0
timeout_minutes: 14400
label_root: /data/GraspPanda-cache/finegrasp
train_checkpoint_mode: initialize
checkpoint_policy: reuse_unchanged
modules:
  crop:
    type: native_cylinder
    nsample: 24
    radius: 0.07
    radius_factors: [0.25, 0.5, 0.75, 1.0]
    fusion_layers: 3
    fusion_heads: 8
    fusion_ffn_dim: 1024
    fusion_dropout: 0.1
loss:
  functions:
    objectness: cross_entropy
    depth: focal
    score: poly1
augmentation:
  mode: native
