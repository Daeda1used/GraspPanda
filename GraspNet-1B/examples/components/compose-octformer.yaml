method: graspnet_baseline
action: train_check
dataset_root: /path/to/GraspNet-1B
checkpoint: checkpoints/graspnet_baseline/checkpoint-rs.tar
checkpoint_policy: reuse_unchanged
camera: realsense
split: train
scene: 0
num_points: 8192
modules:
  backbone:
    type: octformer
    channels: [32, 64, 128, 128]
    num_blocks: [2, 2, 4, 2]
    num_heads: [2, 4, 8, 8]
    patch_size: 32
    dilation: 4
    mlp_ratio: [2, 3, 4, 4]
    use_rpe: [false, true, true, true]
    use_checkpoint: true
    fpn_channel: 64
  crop:
    type: cylinder
    radius_factors: [0.5, 1.0, 1.5]
    pooling: attention
optimizer:
  type: adamw
  weight_decay: 0.01
