dataset: graspnet1b
method: graspnet_baseline
action: train_check
dataset_root: /data/GraspNet-1B
checkpoint: checkpoints/graspnet_baseline/checkpoint-rs.tar
camera: realsense
split: train
scene: 0
workspace: official_gt_workspace
num_points: 4096
training_steps: 3
learning_rate: 0.0001
checkpoint_policy: reuse_unchanged
modules:
  crop:
    type: reslfe_cylinder
    width: 32
    depth: 3
    local_neighbors: 6
    nsample: 12
    radius_factors: [0.5, 1.0]
    mlp_ratio: 2.0
    drop_path: 0.2
    pooling: attention
    activation: silu
    normalization: group
