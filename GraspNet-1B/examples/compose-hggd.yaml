dataset: graspnet1b
method: hggd
action: train_check
dataset_root: /data/GraspNet-1B
checkpoint: checkpoints/hggd/checkpoint-realsense.tar
camera: realsense
split: train
scene: 0
frame: 0
workspace: native_demo
training_steps: 3
learning_rate: 0.00003
checkpoint_policy: reuse_unchanged
modules:
  backbone:
    type: convnextv2
    variant: atto
    stage_channels: [24, 48, 96, 192]
    stage_depths: [1, 1, 2, 1]
    projection_norm: group
optimizer:
  type: lion
  weight_decay: 0.01
scheduler:
  type: cosine
  warmup_steps: 1
  min_lr_ratio: 0.1
loss:
  functions:
    anchor_location: {type: asl, gamma_pos: 0, gamma_neg: 2, clip: 0.02}
    anchor_theta: {type: huber, delta: 0.5}
    local_orientation: poly1
  weights:
    local_offset: 0.8
augmentation:
  mode: custom
  brightness: 0.1
  contrast: 0.1
  depth_noise_std: 0.0005
  depth_noise_clip: 0.002
