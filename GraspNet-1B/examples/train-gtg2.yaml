method: gtg2
action: train
dataset_root: /data/GraspNet-1B
label_root: outputs/prepared/gtg2
camera: realsense
split: train
scene: 0
frame: 0
checkpoint: ""
epochs: 500
batch_size: 128
learning_rate: 0.01
timeout_minutes: 43200
modules:
  backbone:
    type: gtg_sage
    hidden: 64
    layers: 3
    aggregation: max
  crop:
    type: grasp_graph
    k: 5
    max_points: 70
    include_outside: true
    encoding: binary
    candidate_limit: 0
trainer:
  folds: [0, 1, 2, 3, 4]
  sampling: balanced
  refresh_epochs: 10
  negative_per_class: 50000
