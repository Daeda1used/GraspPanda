# AdamW of PyTorch with decoupled weight decay, the default of the transformer encoders.
#
# PTv3, Sonata and LitePT are trained with it by their authors; the grasp references use Adam
# without weight decay.
#
# What must be re-tuned, and why:
# * lr: the value is a starting point for batches of 4 frames of 15000 points; every shipped
#   method was tuned with Adam at 1e-3 (HGGD: AdamW at 1e-2), so compare against that.
# * weight_decay: 0.05 is Pointcept's value for PTv3; it also decays biases and normalisation
#   weights unless `--set optimizer=adamw-no-decay-1d` is used.
# * the schedule of the base config stays (GSNet: a factor 0.95 per epoch); set one with `--set
#   schedule=...` when the optimizer's paper assumes warm-up or a cosine.
optimizer:
  type: AdamW
  lr: 1.0e-3
  weight_decay: 0.05
