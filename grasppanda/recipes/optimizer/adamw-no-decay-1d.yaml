# AdamW with no weight decay on biases and normalisation weights, through ParamGroups.
#
# The rule of timm and of most transformer recipes: only weight matrices are decayed.
#
# Source: the weight-decay rule of PyTorch Image Models.
#
# What must be re-tuned, and why:
# * lr: the value is a starting point for batches of 4 frames of 15000 points. It replaces
#   the method's own optimizer: Adam at 1e-3 for GraspNet-baseline, GSNet, Scale-Balanced-Grasp
#   and EconomicGrasp, Adam at 8e-3 for FineGrasp, AdamW at 1e-2 for HGGD; compare with that.
# * weight_decay: 0.05 applies to parameters with two or more dimensions.
# * the method's own schedule stays (it differs per method:
#   `grasppanda compose <method config> --list schedule` shows it); set one with
#   `--set schedule=...` when the optimizer's paper assumes warm-up or a cosine.
optimizer:
  type: ParamGroups
  optimizer: {type: AdamW, lr: 1.0e-3, weight_decay: 0.05}
  no_decay_1d: true
