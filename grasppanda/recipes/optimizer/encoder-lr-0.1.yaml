# Adam at 1e-3 with the scene encoder at a tenth of the rate (it replaces the method's own
# optimizer, e.g. FineGrasp's Adam at 8e-3).
#
# For an encoder that starts from pretrained weights (`runtime.load_from` or the encoder's own
# `pretrained` option) under freshly initialised stages. Seed-based methods only (HGGD has no
# scene encoder; compose refuses it there).
#
# Source: Pointcept's factor for the transformer blocks of PTv3.
#
# What must be re-tuned, and why:
# * lr_multipliers: 0.1 is Pointcept's factor for the blocks of PTv3; a pattern is a dotted
#   prefix of the parameter name or `re:<regular expression>`.
# * optimizer: Adam at 1e-3 without weight decay, as GraspNet-baseline, GSNet,
#   Scale-Balanced-Grasp and EconomicGrasp ship it; under FineGrasp (Adam at 8e-3, weight
#   decay 1e-5) write its optimizer node here to keep its rate.
optimizer:
  type: ParamGroups
  optimizer: {type: Adam, lr: 1.0e-3, weight_decay: 0.0}
  lr_multipliers: {backbone: 0.1}
