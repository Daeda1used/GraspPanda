# MADGRAD (Defazio and Jelassi, arXiv 2101.11075): dual averaging with momentum.
#
# Through TimmOptimizer; `timm.optim.list_optimizers()` names the other 97, and `options:` takes
# the optimizer's own arguments.
#
# What must be re-tuned, and why:
# * lr: not comparable with Adam's; the paper sweeps it per task.
# * the method's own schedule stays (it differs per method:
#   `grasppanda compose <method config> --list schedule` shows it); set one with
#   `--set schedule=...` when the optimizer's paper assumes warm-up or a cosine.
optimizer:
  type: TimmOptimizer
  name: madgrad
  lr: 1.0e-03
  weight_decay: 0.0
