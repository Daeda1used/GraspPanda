# Huber penalty: quadratic below delta, linear with slope delta above it.
#
# For `value` and `unit` terms. With delta = 1 it is SmoothL1 with beta = 1; elsewhere
# Huber(delta) = delta x SmoothL1(beta = delta).
#
# What must be re-tuned, and why:
# * delta: 1.0, in the units of the target. Width targets are below 1.2 (metres x 10): a delta of
#   0.1 makes errors beyond one centimetre count linearly.
# * weight: not set here. `grasppanda compose` keeps the weight of the loss it replaces; this
#   penalty has another scale than SmoothL1 when delta is not 1, so compare the logged `loss/...`
#   values of both runs and re-tune.
model:
  loss:
    type: Huber
    delta: 1.0                    # knee, in the units of the target
