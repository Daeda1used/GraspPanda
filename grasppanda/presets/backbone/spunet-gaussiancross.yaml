# SpUNet started from the GaussianCross weights (self-supervised on ScanNet, MIT), 5 mm grid.
#
# The released file `gaussiancross-scannet-lin` (157 MB) holds the encoder-decoder that
# GaussianCross pre-trained without labels; it loads key for key. Fetch it first: the
# error of a missing file prints the command. Other SpUNet releases load the same way
# (`gaussiancross-scannet`, `volt-teacher-scannet`): change `pretrained`.
# No grasp result is claimed for this initialisation.
#
# What must be re-tuned, and why:
# * pretrained_mismatch: skip. Two layers do not come from the file and keep their
#   initialisation: the 5 x 5 x 5 stem (the release reads colour and normal, 6 channels;
#   the grasp methods feed 3 constant ones) and the final 1 x 1 layer (`out_channels`).
# * grid_size: 0.005 m, the grid of GSNet, EconomicGrasp and FineGrasp. The weights were
#   trained on rooms at 0.02 m, so every kernel sees a quarter of the extent it was trained
#   on. 0.02 m matches the weights and leaves about one voxel per 16 points of a table-top
#   frame.
# * out_channels: compose sets it to the width of the encoder it replaces; `null`
#   returns the 96 channels of the last decoder stage with no new layer.
# * learning rate: a pretrained encoder under a random head usually takes a lower rate
#   or a warm-up; the base method's recipe has neither.
# * loading a grasp checkpoint trained from this preset builds the encoder first: keep
#   the released file in place or set `pretrained: null` (the checkpoint holds the encoder).
model:
  backbone:
    type: SpUNet                  # `dense`: one feature per input point
    in_channels: 3                # constant ones; geometry enters through the voxel grid
    out_channels: 512
    grid_size: 0.005
    pretrained: gaussiancross-scannet-lin
    pretrained_mismatch: skip     # stem and final layer keep their initialisation
