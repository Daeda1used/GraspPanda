# PointNeXt-S (encoder + decoder) with a table-top radius.
#
# A room-scale encoder whose unit of length has to be changed. No published
# GraspNet-1Billion result uses PointNeXt.
#
# What must be re-tuned, and why:
# * radius. The class default, 0.1 m doubling per stage, is for S3DIS rooms. A table-top
#   frame is about 0.6 m across, so the first ball would already span a sixth of the
#   scene. 0.04 m is the first radius of the GraspNet-baseline PointNet++ on the same
#   data; with doubling the stages see 0.04 / 0.08 / 0.16 / 0.32 m. A choice by analogy,
#   not a tuned value.
# * in_channels: 3 constant ones (the published model reads colour and height), so
#   geometry enters through the grouped offsets only; a method that feeds real features
#   (`point_features: observation`) is the obvious variant.
# * width and depth: PointNeXt-S, 0.8 M parameters and 32 output channels, against a
#   14.6 M sparse U-Net with 512. The published B / L / XL variants are `width`, `blocks`,
#   `sa_layers` and `expansion`. A stage that needs the encoder's width to equal its own
#   (`DepthCylinderGroup` with `seed_residual: gated`) says so when built.
# * optimizer and schedule: the base method's. PointNeXt's own recipe (AdamW, cosine,
#   label smoothing) is part of what that paper claims.
# * memory and speed. Sampling and ball queries run on the pure-PyTorch reference
#   operators: about 0.5 s and 1.7 GiB per forward pass of one 20 000-point frame on an
#   RTX A6000 (docs/model_zoo_backbones.md), several times that with gradients.
model:
  backbone:
    type: PointNeXt               # `dense`: one feature per input point
    in_channels: 3                # constant ones
    radius: 0.04
