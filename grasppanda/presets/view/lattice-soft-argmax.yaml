# LatticeViewStage whose evaluation read-out is a soft-arg-max: a direction between lattice
# views.
#
# In evaluation mode the approach is the softmax-weighted mean direction of the 8 best
# views. Training is unchanged (scores regressed, views sampled).
#
# What must be re-tuned, and why:
# * temperature: 0.05. Regressed scores lie in about [0, 1]; with temperature 1 the weights
#   would be nearly uniform and the mean direction meaningless.
# * top_k: 8 keeps the mean local. With null, all views vote and two separate good regions
#   average to a direction between them that may be bad.
# * loss weight: 100, as GSNet, EconomicGrasp and FineGrasp ship it (GraspNet-baseline and
#   Scale-Balanced-Grasp ship 1, with MSE): under those two it changes the balance of the
#   loss terms. No AP has been measured for this stage under any method.
# * label_views: 300 is the lattice the label files are indexed by. The stage ties every
#   view of its own lattice to the nearest of those 300; it does not create finer labels.
# * max_friction: 0.6 must equal the value compact labels were encoded with
#   (`compact_labels.view_friction_threshold`); the first loss checks it.
model:
  view:
    type: LatticeViewStage
    num_views: 300
    hemisphere: false
    target: score                 # regress a score per view (GSNet, EconomicGrasp, FineGrasp)
    selection: soft_argmax        # evaluation mode: weighted mean of the top_k views
    train_selection: multinomial  # training mode: draw a view from the scores
    top_k: 8
    temperature: 0.05
    label_views: 300              # the lattice of the label files; not a free choice
    max_friction: 0.6
    residual: true                # add the stage's hidden features to the seed features
    loss: {type: SmoothL1, weight: 100.0, beta: 1.0}
