# LatticeViewStage that classifies the best view (softmax cross-entropy) instead of regressing
# every view score.
#
# The target of a seed is the index of its most graspable view; seeds without a graspable
# view are not supervised. `metric/view_accuracy` is logged.
#
# What must be re-tuned, and why:
# * target: best_view changes the meaning of the outputs to logits; the loss must be a
#   classification loss (CrossEntropy).
# * train_selection: argmax. Sampling from min-max normalised logits is GSNet's rule for
#   regressed scores; with logits the arg-max is the plain choice.
# * loss weight: 1.0 is untuned. On a symmetric object two distant views can tie and the
#   target flips between them.
# * label_views: 300 is the lattice the label files are indexed by. The stage ties every
#   view of its own lattice to the nearest of those 300; it does not create finer labels.
# * max_friction: 0.6 must equal the value compact labels were encoded with
#   (`compact_labels.view_friction_threshold`); the first loss checks it.
model:
  view:
    type: LatticeViewStage
    num_views: 300
    hemisphere: false
    target: best_view             # classify the best view
    selection: argmax             # evaluation mode: the best view
    train_selection: argmax      # training mode: the best view
    top_k: null
    temperature: 1.0
    label_views: 300              # the lattice of the label files; not a free choice
    max_friction: 0.6
    residual: true                # add the stage's hidden features to the seed features
    loss: {type: CrossEntropy, weight: 1.0}
