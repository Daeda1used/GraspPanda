# LatticeViewStage that classifies the best view with the angular class loss of RGB Matters on
# top of the cross-entropy.
#
# A wrong view costs (1 - cos)/2 of its angle to the best view, so a neighbour of the best
# view is nearly free and the opposite view costs 1. `metric/view_error_deg` is logged.
#
# What must be re-tuned, and why:
# * angular_weight: 1.0 is untuned. Set the weight of `loss` to 0 to train with the angular
#   cost alone, as RGB Matters' `Class_Loss` does.
# * train_selection: argmax, as for every classification target.
# * label_views: 300 is the lattice the label files are indexed by. The stage ties every
#   view of its own lattice to the nearest of those 300; it does not create finer labels.
# * max_friction: 0.6 must equal the value compact labels were encoded with
#   (`compact_labels.view_friction_threshold`); the first loss checks it.
model:
  view:
    type: LatticeViewStage
    num_views: 300
    hemisphere: false
    target: best_view             # classify the best view
    selection: argmax             # evaluation mode: the best view
    train_selection: argmax      # training mode: the best view
    top_k: null
    temperature: 1.0
    label_views: 300              # the lattice of the label files; not a free choice
    max_friction: 0.6
    residual: true                # add the stage's hidden features to the seed features
    loss: {type: CrossEntropy, weight: 1.0}
    angular_weight: 1.0           # weight of loss/view_angular
