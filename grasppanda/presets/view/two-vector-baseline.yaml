# TwoVectorViewStage in the order of Contact-GraspNet: the baseline keeps its direction, the
# approach is projected.
#
# The idea of Contact-GraspNet's parameterisation on seed features; none of its code is used
# and its contact-point labels are not: targets come from the view labels.
#
# What must be re-tuned, and why:
# * keep: baseline. The approach is what is left of the second vector after removing its
#   component along the baseline, so an error of the baseline tilts the approach.
# * frame_weight: 1.0 is untuned (squared Frobenius distance, at most 8). The frame loss
#   supervises the in-plane rotation as an auxiliary output; the head bundle still decides
#   the in-plane angle of the grasp.
# * num_angle: 12 is the angle grid of the labels and must equal the head bundle's.
# * label_views: 300 is the lattice the label files are indexed by: the regressed direction
#   is snapped to it for the label lookup. Training crops use the label frame of the snapped
#   view, inference crops the frame of the regressed direction (up to 9 degrees apart).
# * direction_weight: 1.0 is untuned (the loss is 1 - cos, at most 2); no AP has been
#   measured for this stage under any method.
# * max_friction: 0.6 must equal the value compact labels were encoded with.
model:
  view:
    type: TwoVectorViewStage
    keep: baseline                # the baseline keeps its direction, the approach is projected
    label_views: 300              # the lattice of the label files; not a free choice
    max_friction: 0.6
    direction_weight: 1.0
    frame_weight: 1.0
    num_angle: 12                 # must equal the head bundle's
    residual: true                # add the stage's hidden features to the seed features
