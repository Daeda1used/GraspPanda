# LatticeViewStage on the camera-facing half of 120 Fibonacci views: the 60-view template of RGB
# Matters.
#
# Only approaches that point away from the camera are candidates.
#
# What must be re-tuned, and why:
# * hemisphere: true removes every approach with a component towards the camera; a grasp
#   that reaches an object from behind can then not be predicted at all.
# * loss weight: 100, as GSNet, EconomicGrasp and FineGrasp ship it (GraspNet-baseline and
#   Scale-Balanced-Grasp ship 1, with MSE): under those two it changes the balance of the loss
#   terms. No AP has been measured for this stage under any method.
# * label_views: 300 is the lattice the label files are indexed by. The stage ties every
#   view of its own lattice to the nearest of those 300; it does not create finer labels.
# * max_friction: 0.6 must equal the value compact labels were encoded with
#   (`compact_labels.view_friction_threshold`); the first loss checks it.
model:
  view:
    type: LatticeViewStage
    num_views: 120                # 60 of them are kept
    hemisphere: true
    target: score                 # regress a score per view (GSNet, EconomicGrasp, FineGrasp)
    selection: argmax             # evaluation mode: the best view
    train_selection: multinomial  # training mode: draw a view from the scores
    top_k: null
    temperature: 1.0
    label_views: 300              # the lattice of the label files; not a free choice
    max_friction: 0.6
    residual: true                # add the stage's hidden features to the seed features
    loss: {type: SmoothL1, weight: 100.0, beta: 1.0}
