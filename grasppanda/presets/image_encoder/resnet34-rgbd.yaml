# ResNet-34 from timm with ImageNet-1k weights and a fourth input channel for depth.
#
# As `resnet34`, with the first convolution widened to RGB-D: the colour filters are the
# pretrained ones, the depth filters start at zero and are learned. Weights: `resnet34.a1_in1k`,
# Apache-2.0 (timm).
#
# What must be re-tuned, and why:
# * depth: fourth_channel. The depth channel is HGGD's: metres, mean removed, clipped to +-1
#   (`model.image.depth_clip`). No pretrained RGB-D filters exist; the depth filters are trained
#   from zero, so early iterations behave like `resnet34`.
# * model.encoder.decoder_channels (default 64): width of the pyramid decoder that follows this
#   encoder and of the feature map of the region stage.
# * optimizer: HGGD's recipe trains a 1.6 M-parameter network from scratch. A pretrained encoder
#   usually wants a smaller learning rate than the decoder, or `frozen: true`.
# * no AP is claimed: this combination was probed for 20 iterations, never trained.
model:
  image_encoder:
    type: TimmImageEncoder
    name: resnet34.a1_in1k
    pretrained: true              # timm downloads the weights; or `checkpoint: <file>`
    depth: fourth_channel         # rgb_only | fourth_channel | depth_stem
    depth_init: zero              # zero: starts as the colour model; mean: the mean colour filter
