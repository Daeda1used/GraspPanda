# EconomicHead with a softmax focal loss on its angle, depth and quality classes and the arg-max
# restricted to the supervised bins.
#
# Everything else is preset `economic`, including its label set: compact grasp labels
# (CompactLabelAssigner), so compose it under EconomicGrasp or FineGrasp. Needs the extra
# `kornia`.
#
# What must be re-tuned, and why:
# * gamma: 2.0 on all three class terms. The quality classes are the unbalanced ones (class 0
#   holds 'no usable grasp' and the worst level); angle and depth may do as well with the plain
#   cross-entropy.
# * decode_argmax: supervised differs from the reference (`all_logits`); it keeps a seed from
#   being decoded to the never-supervised extra class.
# * loss weights: 1 as for the cross-entropies they replace; a focal term is smaller by its
#   modulating factor.
# * score_kind. The decoded score is a weighted sum of raw logits, as in `economic`.
model:
  head:
    type: EconomicHead
    num_angle: 12
    num_depth: 4
    depth_step: 0.01
    num_score: 6
    width_target_scale: 10.0
    width_decode_gain: 1.2        # reference quirk
    unmatched_class: true         # reference quirk
    decode_argmax: supervised
    score_decode: logit_weighted  # reference quirk
    token_channels: 64
    attention_heads: 1
    attention_dropout: 0.05
    angle_loss: {type: SoftmaxFocalLoss, weight: 1.0, gamma: 2.0}
    depth_loss: {type: SoftmaxFocalLoss, weight: 1.0, gamma: 2.0}
    score_loss: {type: SoftmaxFocalLoss, weight: 1.0, gamma: 2.0}
    width_loss: {type: SmoothL1, weight: 10.0, beta: 1.0}
data:
  train:
    dataset:
      compact_labels:             # the label set this head bundle is supervised with
        point_friction_threshold: 0.4
        view_friction_threshold: 0.6   # = model.view.max_friction
        max_width: 0.1            # = the gripper opening
