# Model-free collision filter on the full cloud: drop a grasp whose gripper would hit observed
# points.
#
# Four boxes (two fingers, palm, approach sweep) against the voxelised sensor cloud, as in the
# test script of GraspNet-baseline, which its successors kept. It is the `cd` variant of the
# GraspNet-baseline, GSNet, Scale-Balanced-Grasp and FineGrasp configs (EconomicGrasp's uses a
# 0.005 m voxel; HGGD's starts with `collision-strict`). Needs `keep_full_points` in the
# dataset section.
#
# Use: `--post collision` with grasppanda test, infer or demo; `--set post=collision` with
# grasppanda compose; or copy the fragment into `evaluation.variants.<name>` of a config.
#
# What must be re-tuned, and why:
# * voxel_size: 0.01 m and collision_threshold: 0.01 are the reference values; EconomicGrasp's
#   test script uses a voxel of 0.005 m.
# * approach_distance: 0.05 m of free space behind the gripper along its approach.
evaluation:
  variants:
    post:
      - type: ModelFreeCollisionFilter
        voxel_size: 0.01
        approach_distance: 0.05
        collision_threshold: 0.01
