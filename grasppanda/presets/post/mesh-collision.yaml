# Remove grasps at which the open gripper, as a mesh, would contain scene points.
#
# Needs trimesh: pip install -e ".[trimesh]". Without a mesh file the gripper is the
# benchmark gripper built from boxes, fully open. There is no approach sweep: use it after
# `collision`, not instead of it.
#
# Use: `--post mesh-collision` with grasppanda test, infer or demo; `--set post=mesh-collision`
# with grasppanda compose; or copy the fragment into `evaluation.variants.<name>` of a config.
#
# What must be re-tuned, and why:
# * mesh: not set (built-in boxes). Give the collision mesh of your gripper with
#   `mesh_transform` (mesh file to tool frame) and `scale` (0.001 for millimetres).
# * voxel_size: 0.005 m down-sampling of the scene; max_points: 0 points tolerated inside the
#   gripper. Raise max_points to 2 or 3 for a noisy depth camera.
evaluation:
  variants:
    post:
      - type: GripperMeshCollisionFilter
        voxel_size: 0.005
        max_points: 0
