# One seed per occupied 2 cm voxel of the scene, thinned to 1024 by furthest point sampling: seeds
# on a regular lattice.
#
# Nothing is scored and nothing is supervised here, so it fits every seed-based method: under
# GraspNet-baseline and Scale-Balanced-Grasp the view stage keeps objectness, under the graspness
# family the seeds are no longer filtered by graspness. It needs a `dense` encoder (compose wraps a
# sub-sampling one in FeaturePropagation). No AP has been measured with this option.
#
# What must be re-tuned, and why:
# * sampler.voxel_size: 0.02 m. Fewer occupied cells than num_seeds leave padded, invalid seeds
#   (`metric/real_seeds`); choose the size for your workspace.
# * num_seeds: 1024; the groupers of the seed-based methods gather among these seeds.
model:
  proposal:
    type: SampledSeeds
    num_seeds: 1024
    sampler:
      type: VoxelGridSampler
      voxel_size: 0.02
