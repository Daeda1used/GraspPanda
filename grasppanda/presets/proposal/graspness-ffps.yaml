# Graspable points, then furthest point sampling in feature space (F-FPS of 3DSSD, CVPR 2020): seeds
# that differ in what the encoder sees instead of where they are.
#
# The scorer is the one GSNet, EconomicGrasp and FineGrasp share (objectness and graspness per scene
# point, same targets and losses), so the proposal needs a `dense` encoder (compose wraps a
# sub-sampling one in FeaturePropagation) and the `graspness` section of the training dataset:
#   grasppanda prepare <dataset> --graspness --camera <camera> --config <this config>
# It predicts objectness: a view stage that predicts objectness too (ObjectnessViewStage, GraspNet-
# baseline and Scale-Balanced-Grasp) is refused next to it. No AP has been measured with this
# option; a checkpoint trained with another sampler does not transfer its numbers.
#
# What must be re-tuned, and why:
# * sampler.coord_weight: 1.0 as in the released 3DSSD code; with hundreds of feature channels the
#   coordinates in metres then hardly count. Raise it (10 to 100) to keep spatial spread, or use
#   graspness-fusion-fps.
# * sampler.metric: `concat` is the released code, `sum` is Eq. 1 of the paper.
# * sampler.normalize: true makes the distance independent of feature magnitude.
# * graspness_threshold: 0.1 belongs to graspness normalised to [0, 1] per frame; a frame without
#   any candidate has no real seed (`metric/real_seeds` in the log), which is the first number to
#   watch after a swap.
model:
  proposal:
    type: ScoredSeeds
    num_seeds: 1024
    graspness_threshold: 0.1
    sampler:
      type: FeatureFPS
      metric: concat
      coord_weight: 1.0
      normalize: false
data:
  train:
    dataset:
      graspness:                  # the point-wise labels the proposal is supervised with
        source: native
        friction_threshold: 0.8
        poses: annotations
        dtype: float16
