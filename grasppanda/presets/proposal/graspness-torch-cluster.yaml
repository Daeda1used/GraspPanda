# Graspable points, then furthest point sampling with `torch_cluster.fps`, the kernel of PyTorch
# Geometric (pip install torch-cluster).
#
# The scorer is the one GSNet, EconomicGrasp and FineGrasp share (objectness and graspness per
# scene point, same targets and losses), so the proposal needs a `dense` encoder (compose wraps a
# sub-sampling one in FeaturePropagation) and the `graspness` section of the training dataset:
#   grasppanda prepare <dataset> --graspness --camera <camera> --config <this config>
# It predicts objectness: a view stage that predicts objectness too (ObjectnessViewStage, GraspNet-
# baseline and Scale-Balanced-Grasp) is refused next to it. No AP has been measured with this
# option; a checkpoint trained with another sampler does not transfer its numbers.
#
# What must be re-tuned, and why:
# * sampler.random_start: false starts at the first candidate (repeatable); the library's own
#   default is a random start.
# * graspness_threshold: 0.1 belongs to graspness normalised to [0, 1] per frame; a frame without
#   any candidate has no real seed (`metric/real_seeds` in the log), which is the first number to
#   watch after a swap.
model:
  proposal:
    type: ScoredSeeds
    num_seeds: 1024
    graspness_threshold: 0.1
    sampler:
      type: TorchClusterFPS
      random_start: false
data:
  train:
    dataset:
      graspness:                  # the point-wise labels the proposal is supervised with
        source: native
        friction_threshold: 0.8
        poses: annotations
        dtype: float16
