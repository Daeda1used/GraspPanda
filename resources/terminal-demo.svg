<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 576" width="882" height="576" role="img" aria-label="grasppanda print-config validating a config and rejecting two mistakes">
<rect width="882" height="576" rx="12" fill="#0d1117"/>
<rect width="882" height="36" rx="12" fill="#161b22"/><rect y="24" width="882" height="12" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="441.0" y="23" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">projects/example_project — strict config validation</text>
<g font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" xml:space="preserve">
<text x="26" y="62"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda print-config configs/toy_detector.yaml --check</tspan></text>
<text x="26" y="84"><tspan fill="#3fb950" font-weight="700">✓ </tspan><tspan fill="#e6edf3" font-weight="700">configs/toy_detector.yaml</tspan><tspan fill="#e6edf3"> is valid</tspan></text>
<text x="26" y="106"><tspan fill="#e6edf3">  inherits    default_runtime.yaml, gsnet_10e.yaml</tspan></text>
<text x="26" y="128"><tspan fill="#e6edf3">  components  optimizer: Adam · scheduler: ExponentialLR · model: ToyDetector ·</tspan></text>
<text x="26" y="150"><tspan fill="#e6edf3">  model.backbone: ToyBackbone · model.grouper: ToyGrouper · model.head: ToyHead</tspan></text>
<text x="26" y="172"><tspan fill="#e6edf3">  hash        508e8192883b</tspan></text>
<text x="26" y="194"></text>
<text x="26" y="216"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda print-config configs/toy_detector.yaml --opts model.head.num_angles=6</tspan></text>
<text x="26" y="238"><tspan fill="#e6edf3">✗ 1 config problem in configs/toy_detector.yaml</tspan></text>
<text x="26" y="260"></text>
<text x="26" y="282"><tspan fill="#e6edf3">  model.head.num_angles</tspan></text>
<text x="26" y="304"><tspan fill="#e6edf3">    ToyHead has no parameter &#x27;num_angles&#x27;. Did you mean &#x27;num_angle&#x27;? Parameters: num_angle,</tspan></text>
<text x="26" y="326"><tspan fill="#e6edf3">    num_depth, depth_step, max_width, width_weight, in_channels.</tspan></text>
<text x="26" y="348"><tspan fill="#e6edf3">    set in: &lt;command line&gt;</tspan></text>
<text x="26" y="370"></text>
<text x="26" y="392"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda print-config configs/toy_detector.yaml --opts model.grouper.type=ToyDepthGrouper</tspan></text>
<text x="26" y="414"><tspan fill="#e6edf3">✗ 1 config problem in configs/toy_detector.yaml</tspan></text>
<text x="26" y="436"></text>
<text x="26" y="458"><tspan fill="#e6edf3">  model</tspan></text>
<text x="26" y="480"><tspan fill="#e6edf3">    ToyDepthGrouper emits features with axes (&#x27;seed&#x27;, &#x27;depth&#x27;, &#x27;channel&#x27;), but ToyHead</tspan></text>
<text x="26" y="502"><tspan fill="#e6edf3">    expects (&#x27;seed&#x27;, &#x27;channel&#x27;). Use a grouper and a head that agree; a depth axis is never</tspan></text>
<text x="26" y="524"><tspan fill="#e6edf3">    added or squeezed implicitly.</tspan></text>
<text x="26" y="546"><tspan fill="#e6edf3">    set in: configs/toy_detector.yaml</tspan></text>
</g></svg>
