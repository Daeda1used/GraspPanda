<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="GraspPanda pipeline slots and the data contracts between them">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="1278" height="468" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="36" y="52" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328">One pipeline, typed contracts between slots</text>
<text x="36" y="84" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#57606a">Each box is a config slot and names what it emits. A swap is accepted only when the contracts still match.</text>
<rect x="24" y="146.0" width="124" height="56" rx="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="86" y="180.0" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Observation</text>
<line x1="148" y1="174.0" x2="173" y2="174.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="176" y="118" width="180" height="112" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/><text x="266.0" y="156" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">Backbone</text><text x="266.0" y="183" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#1a7f37">model.backbone</text><text x="266.0" y="211" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#57606a">→ PointFeatures</text>
<line x1="356" y1="174.0" x2="387" y2="174.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="390" y="118" width="180" height="112" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/><text x="480.0" y="156" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">Proposal</text><text x="480.0" y="183" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#1a7f37">model.proposal</text><text x="480.0" y="211" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#57606a">→ SeedSet</text>
<line x1="570" y1="174.0" x2="601" y2="174.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="604" y="118" width="180" height="112" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/><text x="694.0" y="156" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">View</text><text x="694.0" y="183" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#1a7f37">model.view</text><text x="694.0" y="211" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#57606a">→ ApproachSet</text>
<line x1="784" y1="174.0" x2="815" y2="174.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="818" y="118" width="180" height="112" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/><text x="908.0" y="156" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">Grouper</text><text x="908.0" y="183" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#1a7f37">model.grouper</text><text x="908.0" y="211" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#57606a">→ GroupFeatures</text>
<line x1="998" y1="174.0" x2="1029" y2="174.0" stroke="#57606a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1032" y="118" width="180" height="112" rx="14" fill="#dafbe1" stroke="#2da44e" stroke-width="2.5"/><text x="1122.0" y="156" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">Head bundle</text><text x="1122.0" y="183" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#1a7f37">model.head</text><text x="1122.0" y="211" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#57606a">→ GraspGroup</text>
<circle cx="44" cy="278" r="5" fill="#2da44e"/><text x="60" y="284" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328"><tspan font-weight="700">Head bundle = head + target encoder + loss + decoder.</tspan> <tspan fill="#57606a">One grasp parameterization; swapped as a unit.</tspan></text>
<circle cx="44" cy="320" r="5" fill="#2da44e"/><text x="60" y="326" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328"><tspan font-weight="700">Observation ≠ Supervision.</tspan> <tspan fill="#57606a">predict() never sees ground truth; GT-derived inputs are declared and stamped on results.</tspan></text>
<circle cx="44" cy="362" r="5" fill="#2da44e"/><text x="60" y="368" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328"><tspan font-weight="700">GraspGroup → post-processors → evaluator.</tspan> <tspan fill="#57606a">Collision filter on and off are always reported side by side.</tspan></text>
<circle cx="44" cy="404" r="5" fill="#2da44e"/><text x="60" y="410" font-family="'Inter', 'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328"><tspan font-weight="700">Not every method is this pipeline.</tspan> <tspan fill="#57606a">Image-to-region (HGGD) and dense-contact detectors keep only the outer contract.</tspan></text>
</svg>
