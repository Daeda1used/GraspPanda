<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 568" width="680" height="568" role="img" aria-label="GraspNet-1Billion and GraspClutter6D feed two detector families. The seed-based skeleton of 5 methods has the slots scene encoder, seed proposal, view, assigner, grouper, head bundle, and losses. HGGD has its own family: image encoder, heat-map stage, region stage. Post-processing and the training recipe are shared by all 6 methods.">
