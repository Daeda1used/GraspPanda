<g font-family="'JetBrains Mono', 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" xml:space="preserve">
<text class="k7" x="52" y="270"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e \</tspan></text>
<text class="k8" x="52" y="305">    <tspan fill="#e6edf3" font-weight="700">--set backbone=pointnet2 --set grouper=multi-scale \</tspan></text>
<text class="k9" x="52" y="340">    <tspan fill="#e6edf3" font-weight="700">-o gsnet_pointnet2_multi-scale.yaml</tspan></text>
<text class="k10" x="52" y="383" fill="#e6edf3">  • wrapped PointNet2 in the adapter FeaturePropagation (preset</text>
<text class="k10" x="52" y="418" fill="#e6edf3">    `feature-propagation`): GraspnessFPS requires &#x27;dense&#x27; scene features,</text>
<text class="k10" x="52" y="453" fill="#e6edf3">    but PointNet2 returns &#x27;subsampled&#x27; ones (features on a sub-sampled</text>
<text class="k10" x="52" y="488" fill="#e6edf3">    point set). An adapter changes the model; its notes below say how.</text>
<text class="k11" x="52" y="523" fill="#3fb950">  ✓ backbone · proposal</text>
<text class="k12" x="52" y="558" fill="#3fb950">  ✓ grouper · head</text>
<text class="k13" x="52" y="593" fill="#3fb950">  ✓ valid  (hash 76e5ab997651)</text>
<text class="k14" x="52" y="628" fill="#3fb950" font-weight="700">✓ written gsnet_pointnet2_multi-scale.yaml</text>
<text class="k15" x="52" y="270"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda compose gsnet/gsnet_sunet14_g1b-realsense_10e \</tspan></text>
<text class="k16" x="52" y="305">    <tspan fill="#e6edf3" font-weight="700">--set head=economic</tspan></text>
<text class="k17" x="52" y="348" fill="#ff7b72">  ✗ assigner · head: NearestLabelAssigner returns &#x27;dense&#x27; matched labels,</text>
<text class="k17" x="52" y="383" fill="#ff7b72">    but EconomicHead is supervised with &#x27;compact&#x27; ones. A head bundle and</text>
<text class="k17" x="52" y="418" fill="#ff7b72">    the assigner that feeds it must agree on the label set; the dataset</text>
<text class="k17" x="52" y="453" fill="#ff7b72">    must serve that label set too.</text>
<text class="k18" x="52" y="488" fill="#ff7b72" font-weight="700">✗ refused: nothing was written. The messages above name the conflict and a</text>
<text class="k18" x="52" y="523" fill="#ff7b72" font-weight="700">  fix.</text>
<text class="k19" x="52" y="270"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3" font-weight="700">grasppanda probe gsnet_pointnet2_multi-scale.yaml --iters 20 --frames 8</tspan></text>
<text class="k20" x="52" y="313" fill="#e6edf3">  model       GSNet · 4,730,280 parameters</text>
<text class="k21" x="52" y="348" fill="#e6edf3">  data        8 frames of the config&#x27;s dataset · 4 per iteration</text>
<text class="k22" x="52" y="383" fill="#e6edf3">    loss/view                   1.885 → 0.4012</text>
<text class="k23" x="52" y="418" fill="#e6edf3">    loss/width                  2.468 → 0.1336 loss</text>
<text class="k23" x="52" y="453" fill="#e6edf3">    6.12 → 1.496</text>
<text class="k24" x="52" y="488" fill="#e6edf3">  predicted   2 frame(s) · 310, 21 grasps</text>
<text class="k25" x="52" y="523" fill="#3fb950" font-weight="700">✓ runs: trained 20 iterations on 8 frames of the dataset and predicted on</text>
<text class="k25" x="52" y="558" fill="#3fb950" font-weight="700">  2 frame(s), with finite losses and real seeds in every iteration.</text>
</g></svg>
